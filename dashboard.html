<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Dashboard | EcoReport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-green-800 text-white md:min-h-screen p-6">
            <div class="flex items-center gap-2 font-bold text-2xl mb-10">
                <i class="fas fa-recycle text-green-400"></i> EcoReport
            </div>
            <nav class="space-y-4">
                <a href="dashboard.html" class="flex items-center gap-3 p-3 bg-green-700 rounded-lg"><i class="fas fa-th-large w-5"></i> Dashboard</a>
                <a href="index.html#report-form" class="flex items-center gap-3 p-3 hover:bg-green-700 rounded-lg transition"><i class="fas fa-plus-circle w-5"></i> New Report</a>
                <a href="#" class="flex items-center gap-3 p-3 hover:bg-green-700 rounded-lg transition"><i class="fas fa-map-marked-alt w-5"></i> Local Map</a>
                <a href="#" class="flex items-center gap-3 p-3 hover:bg-green-700 rounded-lg transition"><i class="fas fa-user-circle w-5"></i> Profile</a>
                <div class="pt-10">
                    <a href="index.html" class="flex items-center gap-3 p-3 text-green-300 hover:text-white transition">
                        <i class="fas fa-sign-out-alt w-5"></i> Logout
                    </a>
                </div>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Welcome back, John!</h1>
                    <p class="text-gray-500 font-medium">Springfield North Neighborhood</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="clearAllReports()" class="bg-red-100 text-red-600 px-4 py-3 rounded-xl font-bold hover:bg-red-200 transition">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button onclick="window.location.href='index.html#report-form'" class="bg-green-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition">
                        + Report New Garbage
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Total Reports</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-gray-800">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Resolved</p>
                    <h3 id="stat-resolved" class="text-3xl font-bold text-green-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Pending</p>
                    <h3 id="stat-pending" class="text-3xl font-bold text-orange-500">0</h3>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Your Recent Reports</h2>
                    <button class="text-green-600 font-semibold text-sm hover:underline">View All</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold">
                            <tr>
                                <th class="px-6 py-4">ID</th>
                                <th class="px-6 py-4">Type</th>
                                <th class="px-6 py-4">Date Reported</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="reports-table-body" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        // Additional function for testing: Clears all saved data
        function clearAllReports() {
            if(confirm("Are you sure you want to clear all reports?")) {
                localStorage.removeItem('ecoReports');
                location.reload();
            }
        }

        // Logic to update the Stats numbers based on localStorage data
        document.addEventListener('DOMContentLoaded', () => {
            const reports = JSON.parse(localStorage.getItem('ecoReports')) || [];
            
            const total = reports.length;
            const resolved = reports.filter(r => r.status === 'Resolved').length;
            const pending = reports.filter(r => r.status === 'Pending').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-resolved').innerText = resolved;
            document.getElementById('stat-pending').innerText = pending;
        });
    </script>
</body>
</html>
