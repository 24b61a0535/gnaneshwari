<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanupHub | Home</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<nav>
    <div class="logo">🌿 CleanupHub</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="tracker.html">Report</a>
        <a href="dashboard.html">Map</a>
        <a href="leaderboard.html">Ranking</a>
        <a href="impact.html">My Impact</a>
        <a href="education.html">Learn</a>
    </div>
</nav>

<div class="container">
    <h1>Welcome to CleanupHub</h1>
    <p>Join the community in keeping our streets clean and sustainable.</p>
    
    <nav style="margin-bottom: 20px;">
        <a href="login.html">Login</a> | 
        <a href="registration.html">Register</a>
    </nav>

    <div id="map"></div>
</div>

<footer>
    <p>&copy; 2026 Digital Platform for Community Garbage Reporting</p>
</footer>

<script>
    // Initialize the map centered on Hyderabad
    var map = L.map('map').setView([17.3850, 78.4867], 12);

    // Load the street images (Tiles)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Add a sample "Active Cleanup" marker
    var marker = L.marker([17.3850, 78.4867]).addTo(map);
    marker.bindPopup("<b>Hyderabad Center</b><br>Active community reporting zone.").openPopup();

    // Fix for map loading in hidden containers
    setTimeout(function(){ map.invalidateSize()}, 400);
</script>

</body>
</html>
