<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | EcoReport Authority</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #admin-map { 
            height: 400px; 
            width: 100%; 
            border-radius: 0.75rem; 
            z-index: 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

    <aside class="w-64 bg-slate-900 text-slate-300 hidden lg:flex flex-col">
        <div class="p-6 text-white font-bold text-xl flex items-center gap-2 border-b border-slate-800">
            <i class="fas fa-shield-alt text-green-500"></i> Admin Center
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <p class="px-4 py-2 text-xs font-semibold uppercase text-slate-500">Management</p>
            <a href="#" class="flex items-center gap-3 p-3 bg-slate-800 text-white rounded-lg">
                <i class="fas fa-list-ul w-5"></i> Incoming Reports
            </a>
            <a href="#" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg transition">
                <i class="fas fa-truck w-5"></i> Dispatch Crew
            </a>
            <a href="#" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg transition">
                <i class="fas fa-chart-pie w-5"></i> Analytics
            </a>
            <p class="px-4 py-2 mt-6 text-xs font-semibold uppercase text-slate-500">System</p>
            <a href="#" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg transition">
                <i class="fas fa-users w-5"></i> Resident Database
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <a href="index.html" class="flex items-center gap-3 p-3 text-red-400 hover:bg-red-500/10 rounded-lg transition">
                <i class="fas fa-power-off w-5"></i> Logout
            </a>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-10">
            <h2 class="font-bold text-slate-800">Operational Overview - Hyderabad District</h2>
            <div class="flex items-center gap-4">
                <span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">System Online</span>
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" class="w-8 h-8 rounded-full border">
            </div>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold mb-1">UNASSIGNED</p>
                    <h3 id="admin-stat-unassigned" class="text-2xl font-bold text-red-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold mb-1">IN PROGRESS</p>
                    <h3 id="admin-stat-progress" class="text-2xl font-bold text-blue-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold mb-1">CLEANED TODAY</p>
                    <h3 id="admin-stat-resolved" class="text-2xl font-bold text-green-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold mb-1">TOTAL REPORTS</p>
                    <h3 id="admin-stat-total" class="text-2xl font-bold text-slate-800">0</h3>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-8 p-4">
                <h3 class="font-bold text-slate-800 text-lg mb-4">Live Incident Map</h3>
                <div id="admin-map"></div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-lg
