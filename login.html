<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoReport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-green-600 font-bold text-2xl mb-2">
                <i class="fas fa-recycle"></i> EcoReport
            </a>
            <h2 class="text-xl font-semibold text-gray-700">Welcome Back</h2>
            <p class="text-gray-500 text-sm">Help keep your community clean</p>
        </div>

        <form action="dashboard.html" class="space-y-5">
            <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                <button type="button" class="flex-1 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-green-600">Resident</button>
                <button type="button" class="flex-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">Official</button>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" required class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="name@email.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" required class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="rounded text-green-600 mr-2"> Remember me
                </label>
                <a href="#" class="text-green-600 hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 shadow-lg transition transform hover:-translate-y-1">
                Sign In
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-gray-600">
            Don't have an account? 
            <a href="register.html" class="text-green-600 font-bold hover:underline">Create Account</a>
        </p>
    </div>

</body>
</html>
