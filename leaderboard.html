<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cleanup Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏆 Community Heroes</h1>
        <p>Top volunteers this month based on resolved reports.</p>
        
        <table style="width:100%; background:white; border-radius:10px; padding:20px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
            <tr style="border-bottom:1px solid #ddd;">
                <th>Rank</th>
                <th>Volunteer</th>
                <th>Points (XP)</th>
                <th>Badges</th>
            </tr>
            <tr>
                <td>🥇 1</td>
                <td>Alex Green</td>
                <td>2,450</td>
                <td>🌟 Plastic Pioneer</td>
            </tr>
            <tr>
                <td>🥈 2</td>
                <td>Sarah Eco</td>
                <td>1,820</td>
                <td>🛡️ Waste Warrior</td>
            </tr>
            <tr>
                <td>🥉 3</td>
                <td>City Cleaner</td>
                <td>1,100</td>
                <td>🌱 Eco Starter</td>
            </tr>
        </table>
    </div>
</body>
</html>
