<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Join the Cleanup - Register</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reg-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #218838; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<nav>
    <div class="logo">🌿 CleanupHub</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="tracker.html">Report</a>
        <a href="dashboard.html">Map</a>
        <a href="leaderboard.html">Ranking</a>
        <a href="impact.html">My Impact</a>
        <a href="education.html">Learn</a>
    </div>
</nav>

<div class="reg-card">
    <h2>Create Account</h2>
    <form id="regForm">
        <input type="text" id="username" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <!-- User Role Selection -->
        <label for="role" style="font-size: 14px; color: #666;">I want to join as a:</label>
        <select id="role" required>
            <option value="citizen">Citizen (Report Issues)</option>
            <option value="volunteer">Volunteer (Cleanup & Verify)</option>
        </select>

        <button type="submit">Sign Up</button>
    </form>
    <div class="footer-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Collect user data
        const userData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            role: document.getElementById('role').value
        };

        // Save to browser storage (Simulating a database)
        localStorage.setItem('currentUser', JSON.stringify(userData));
        
        alert("Registration Successful as " + userData.role.toUpperCase() + "!");
        
        // Redirect based on role
        if (userData.role === 'volunteer') {
            window.location.href = "dashboard.html";
        } else {
            window.location.href = "tracker.html";
        }
    });
</script>

</body>
</html>
