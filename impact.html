<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Environmental Impact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📊 Your Environmental Impact</h1>
        <div class="badge-section">
            <h2>Current Rank: <span style="color:#28a745;">Elite Ranger</span></h2>
            <p>You have resolved <strong>15 reports</strong> this year!</p>
        </div>

        <div class="stats-container">
            <div class="stat-card resolved">
                <h3>52kg</h3>
                <p>Plastic Recycled</p>
            </div>
            <div class="stat-card pending">
                <h3>150 hrs</h3>
                <p>TV Power Saved</p>
            </div>
        </div>
        
        <h3>Recent Achievements</h3>
        <ul>
            <li>🏅 <b>First Report:</b> Awarded for your first verified cleanup.</li>
            <li>🔥 <b>7-Day Streak:</b> Reported issues for 7 consecutive days.</li>
        </ul>
    </div>
</body>
</html>
